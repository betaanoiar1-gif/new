<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #1b1f2a; }
</style>
</head>
<body>
<!-- Phase 0 timeline scene (A4). Two motion mechanisms side by side:
     - a paused GSAP timeline driven only through window.__seek(t)  (absolute time)
     - an incremental integrator driven through window.__tickStep(dt) (history dependent) -->
<svg id="stage" data-kpe-id="stage" width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="1280" fill="#1b1f2a"/>
  <rect id="spinner" data-kpe-id="spinner" x="260" y="200" width="200" height="200" fill="#e0b84c" transform="translate(360 300) rotate(0) translate(-360 -300)"/>
  <circle id="ball" data-kpe-id="ball" cx="60" cy="600" r="40" fill="#4fb3d9"/>
  <text id="label" data-kpe-id="label" x="360" y="800" text-anchor="middle" font-family="sans-serif" font-size="48" fill="#ffffff">timeline</text>
  <circle id="tick" data-kpe-id="tick" cx="60" cy="1000" r="40" fill="#e8615a"/>
  <text id="tickLabel" data-kpe-id="tickLabel" x="360" y="1080" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ffffff">tick(dt)</text>
</svg>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  // ---- Timeline (absolute time) ----
  var tl = gsap.timeline({ paused: true });
  tl.to('#ball', { x: 600, duration: 4, ease: 'power2.inOut' }, 0);
  tl.to('#spinner', { rotation: 360, svgOrigin: '360 300', duration: 8, ease: 'none' }, 0);
  tl.to('#label', { opacity: 0.2, duration: 1, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1);
  window.__timeline = tl;
  window.__seek = function (t) {
    tl.pause();
    tl.seek(t, false);
  };

  // ---- Incremental integrator (tick style): state depends on every previous step ----
  var K = 18, C = 4.5, TARGET = 600;
  window.__tick = { x: 60, v: 0, t: 0 };
  window.__tickReset = function () { window.__tick = { x: 60, v: 0, t: 0 }; applyTick(); };
  window.__tickStep = function (dt) {
    var s = window.__tick;
    var a = K * (TARGET - s.x) - C * s.v;
    s.v += a * dt;
    s.x += s.v * dt;
    s.t += dt;
    applyTick();
    return s.x;
  };
  function applyTick() { document.getElementById('tick').setAttribute('cx', String(window.__tick.x)); }

  function markReady() {
    Promise.resolve(document.fonts ? document.fonts.ready : null).then(function () {
      window.__kpeReady = true;
    });
  }
  if (document.readyState === 'complete') markReady(); else window.addEventListener('load', markReady);
</script>
</body>
</html>
